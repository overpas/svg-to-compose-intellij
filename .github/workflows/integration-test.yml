name: Integration tests

on:
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  integration-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - name: Cache IDE
        uses: actions/cache@v4
        with:
          path: |
            out/ide-tests/cache
            out/ide-tests/installers
          key: ide-tests-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fluxbox
      - name: Run integration tests on virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" bash -c 'fluxbox >/dev/null 2>&1 & ./gradlew integrationTest'
      - name: Run integration tests
        if: runner.os != 'Linux'
        run: ./gradlew integrationTest
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/integrationTest/
            out/ide-tests/tests/**/log/
          retention-days: 7
