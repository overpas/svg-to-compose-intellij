[versions]
kotlin = "2.4.21"
intellij-platform = "2.19.0"
detekt = "2.0.0-alpha.6"
junit = "4.13.2"
kotlin-coroutines = "1.10.2"
svg-to-compose = "0.11.0"
mockito-kotlin = "6.4.0"
compose-desktop = "1.12.2"
turbine = "1.2.1"
compose-rules = "0.6.8"
intellij-inspections = "0.2.0"
lifecycle = "2.11.0"

[libraries]
svg-to-compose = { group = "com.github.DevSrSouza", name = "svg-to-compose", version.ref = "svg-to-compose" }
detekt-compose-rules = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }
detekt-ktlint-wrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
intellij-inspections-gradle-best-practices = { module = "io.github.overpas:intellij-inspections-gradle-best-practices", version.ref = "intellij-inspections" }
intellij-inspections-jvm-all = { module = "io.github.overpas:intellij-inspections-jvm-all", version.ref = "intellij-inspections" }
intellij-inspections-kotlin-all = { module = "io.github.overpas:intellij-inspections-kotlin-all", version.ref = "intellij-inspections" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
kotlin-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
lifecycle-common-jvm = { group = "androidx.lifecycle", name = "lifecycle-common-jvm", version.ref = "lifecycle" }
lifecycle-runtime-desktop = { group = "androidx.lifecycle", name = "lifecycle-runtime-desktop", version.ref = "lifecycle" }

[plugins]
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
compose-desktop = { id = "org.jetbrains.compose", version.ref = "compose-desktop" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
